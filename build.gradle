plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

repositories {
	// Add extra repositories here if you need them
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

publishMods {
	file = tasks.named('remapJar').flatMap { it.archiveFile }
	changelog = providers.fileContents(project.layout.projectDirectory.file("CHANGELOG.md")).asText
	type = STABLE
	version = "${project.version}-${project.minecraft_version}"
	displayName = "Leaderstats ${project.version} (${project.minecraft_version} Fabric)"
	modLoaders.add("fabric")

	// Driven by the shared publish workflow. When true nothing is uploaded and
	// the release assets are written to the build directory instead.
	dryRun = providers.environmentVariable("PUBLISH_DRY_RUN").map { it == "true" }.getOrElse(false)

	modrinth {
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		// FIXME: the plugin rejects this with "leaderstats is not a valid Modrinth
		// ID". It needs the base62 id, which is not readable from the API while the
		// project is still a draft. Replace with the Project ID from
		// modrinth.com/mod/leaderstats/settings before a live publish.
		projectId = "leaderstats"
		minecraftVersions.add("1.20.1")
		requires { slug = "fabric-api" }
	}

	curseforge {
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		projectId = "1688382"
		projectSlug = "leaderstats"
		minecraftVersions.add("1.20.1")
		clientRequired = true
		serverRequired = true
		requires { slug = "fabric-api" }
	}
}
